[package]
name = "drovr"
version = "0.2.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "drovr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.3", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
