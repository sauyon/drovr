<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drovr Review Loop</title>
<script src="/web/vendor/markdown-it.min.js"></script>
<script src="/web/vendor/pierre-diffs.js"></script>
<style>
  /* ---- CSS reset + design tokens ---- */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f9f9f9;
    --surface: #ffffff;
    --border: #d0d0d0;
    --text: #1a1a1a;
    --muted: #666;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #dc2626;
    --success: #16a34a;
    --warn-bg: #fef9c3;
    --warn-border: #ca8a04;
    --ins-bg: #d1fae5;
    --del-bg: #fee2e2;
    --del-text: #991b1b;
    --ins-text: #065f46;
    --radius: 6px;
    --font: system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111;
      --surface: #1e1e1e;
      --border: #333;
      --text: #e8e8e8;
      --muted: #999;
      --accent: #60a5fa;
      --accent-hover: #93c5fd;
      --danger: #f87171;
      --success: #4ade80;
      --warn-bg: #422006;
      --warn-border: #d97706;
      --ins-bg: #064e3b;
      --del-bg: #450a0a;
      --del-text: #fca5a5;
      --ins-text: #6ee7b7;
    }
  }

  [data-theme="dark"] {
    --bg: #111;
    --surface: #1e1e1e;
    --border: #333;
    --text: #e8e8e8;
    --muted: #999;
    --accent: #60a5fa;
    --accent-hover: #93c5fd;
    --danger: #f87171;
    --success: #4ade80;
    --warn-bg: #422006;
    --warn-border: #d97706;
    --ins-bg: #064e3b;
    --del-bg: #450a0a;
    --del-text: #fca5a5;
    --ins-text: #6ee7b7;
  }

  [data-theme="light"] {
    --bg: #f9f9f9;
    --surface: #ffffff;
    --border: #d0d0d0;
    --text: #1a1a1a;
    --muted: #666;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #dc2626;
    --success: #16a34a;
    --warn-bg: #fef9c3;
    --warn-border: #ca8a04;
    --ins-bg: #d1fae5;
    --del-bg: #fee2e2;
    --del-text: #991b1b;
    --ins-text: #065f46;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ---- Layout ---- */
  .shell {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
  }

  .topbar h1 {
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text);
  }

  .turn-badge {
    font-size: 0.78rem;
    color: var(--muted);
    font-family: var(--mono);
  }

  /* ---- Theme toggle ---- */
  #theme-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px 10px;
    font-size: 0.82rem;
    cursor: pointer;
    color: var(--text);
  }
  #theme-btn:hover { border-color: var(--accent); }

  /* ---- Summary banner ---- */
  .summary-banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 18px;
    font-size: 0.9rem;
  }
  .summary-banner strong { display: block; margin-bottom: 4px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: .04em; opacity: .7; }

  /* ---- Panels ---- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 20px;
    overflow-x: auto;
  }

  .panel-title {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin-bottom: 14px;
  }
  /* panel title with a right-aligned action (e.g. the diff toggle) */
  .panel-title.with-action {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .panel-action-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3px 9px;
    font-size: 0.72rem;
    text-transform: none;
    letter-spacing: 0;
    cursor: pointer;
    color: var(--text);
  }
  .panel-action-btn:hover { border-color: var(--accent); }

  /* ---- Markdown content ---- */
  .md-content h1, .md-content h2, .md-content h3 { margin: 1em 0 .4em; line-height: 1.3; }
  .md-content h1 { font-size: 1.5rem; }
  .md-content h2 { font-size: 1.25rem; }
  .md-content h3 { font-size: 1.05rem; }
  .md-content p { margin: .6em 0; }
  .md-content ul, .md-content ol { padding-left: 1.6em; margin: .5em 0; }
  .md-content li { margin: .25em 0; }
  .md-content code { background: var(--border); border-radius: 3px; padding: 1px 5px; font-family: var(--mono); font-size: .87em; }
  .md-content pre { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; overflow-x: auto; margin: .8em 0; }
  .md-content pre code { background: none; padding: 0; }
  .md-content blockquote { border-left: 3px solid var(--border); margin: .6em 0; padding-left: 1em; color: var(--muted); }
  .md-content table { border-collapse: collapse; width: 100%; margin: .8em 0; }
  .md-content th, .md-content td { border: 1px solid var(--border); padding: 6px 10px; }
  .md-content th { background: var(--bg); }
  .md-content a { color: var(--accent); }
  .md-content hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }

  /* ---- Diff highlighting ---- */
  .diff-content ins, .diff-content .diffins {
    background: var(--ins-bg);
    color: var(--ins-text);
    text-decoration: none;
    border-radius: 2px;
  }
  .diff-content del, .diff-content .diffmod, .diff-content .diffdel {
    background: var(--del-bg);
    color: var(--del-text);
    border-radius: 2px;
  }

  /* ---- Source (before→after) line diff ---- */
  .diff-lines {
    font-family: var(--mono);
    font-size: 0.85rem;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    tab-size: 2;
  }
  .diff-line {
    display: flex;
    padding: 0 4px;
    border-radius: 2px;
  }
  .diff-line .gutter {
    flex: 0 0 auto;
    width: 1.4em;
    color: var(--muted);
    user-select: none;
    opacity: .7;
  }
  .diff-line .text { flex: 1 1 auto; white-space: pre-wrap; }
  .diff-line.ctx { color: var(--muted); }
  .diff-line.add {
    background: var(--ins-bg);
    color: var(--ins-text);
  }
  .diff-line.add .gutter { color: var(--ins-text); }
  .diff-line.del {
    background: var(--del-bg);
    color: var(--del-text);
  }
  .diff-line.del .gutter { color: var(--del-text); }
  /* word-level emphasis inside a changed line */
  .diff-line.add ins {
    background: color-mix(in srgb, var(--ins-text) 22%, transparent);
    text-decoration: none;
    border-radius: 2px;
  }
  .diff-line.del del {
    background: color-mix(in srgb, var(--del-text) 22%, transparent);
    text-decoration: none;
    border-radius: 2px;
  }
  .diff-line.meta, .diff-line.hunk {
    color: var(--muted);
    opacity: .8;
  }
  .diff-line.hunk { background: var(--bg); }

  /* ---- Code-review findings ---- */
  .review-verdict {
    font-size: .82rem;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .review-verdict.clean { color: var(--ins-text); }
  .review-verdict.changes { color: var(--del-text); }
  .review-findings { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
  .finding {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 12px;
    background: var(--bg);
  }
  .finding-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sev-badge {
    font-size: .68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    border-radius: 3px;
    padding: 1px 6px;
    color: #fff;
  }
  .sev-badge.critical { background: #c0392b; }
  .sev-badge.important { background: #d97706; }
  .sev-badge.nit { background: #6b7280; }
  .angle-tag {
    font-size: .68rem;
    font-family: var(--mono);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
  }
  .finding-loc { font-family: var(--mono); font-size: .74rem; color: var(--accent); }
  .finding-summary { margin: 5px 0 0; font-size: .88rem; }
  .finding-rationale { margin: 3px 0 0; font-size: .8rem; color: var(--muted); }
  /* inline finding markers layered over the reviewed diff */
  .diff-line .finding-mark {
    display: inline-block;
    margin-left: 8px;
    font-size: .66rem;
    font-weight: 700;
    border-radius: 3px;
    padding: 0 5px;
    color: #fff;
    vertical-align: middle;
  }
  .diff-line .finding-mark.critical { background: #c0392b; }
  .diff-line .finding-mark.important { background: #d97706; }
  .diff-line .finding-mark.nit { background: #6b7280; }
  .review-empty { color: var(--muted); font-size: .85rem; }

  /* ---- Per-line annotation affordance ---- */
  .annotatable {
    position: relative;
  }
  .annotatable .annot-trigger {
    position: absolute;
    left: -28px;
    top: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    line-height: 22px;
    text-align: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s;
    user-select: none;
    font-weight: 700;
    border: none;
  }
  .annotatable:hover .annot-trigger { opacity: 1; }
  .annotation-box {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: var(--radius);
    padding: 8px 10px;
    margin-top: 6px;
  }
  .annotation-box textarea {
    min-height: 60px;
    margin-bottom: 6px;
    font-size: 0.85rem;
  }
  .annotation-box .btn-row { gap: 6px; }
  .annotation-box button.primary { padding: 4px 12px; font-size: 0.82rem; }
  .annotation-save-btn { background: var(--success) !important; }
  .annotation-cancel-btn {
    background: none !important;
    border: 1px solid var(--border) !important;
    color: var(--text) !important;
    border-radius: var(--radius);
    padding: 4px 12px;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .saved-annotations {
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .saved-annot-chip {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 0.82rem;
  }
  .saved-annot-chip .annot-comment { flex: 1; color: var(--text); }
  .saved-annot-chip .annot-remove {
    cursor: pointer;
    color: var(--danger);
    font-size: 0.9rem;
    font-weight: 700;
    background: none;
    border: none;
    padding: 0 2px;
    line-height: 1;
  }

  /* ---- Open questions (multiple choice) ---- */
  .questions-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  .questions-panel .panel-title { margin-bottom: 12px; }
  .question-item {
    margin-bottom: 14px;
  }
  .question-item:last-child { margin-bottom: 0; }
  .question-prompt {
    font-size: 0.92rem;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
  }
  .question-options {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .question-options label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .rec-badge {
    background: var(--accent);
    color: #fff;
    font-size: 0.7rem;
    border-radius: 3px;
    padding: 1px 5px;
    font-weight: 600;
    letter-spacing: .03em;
  }

  /* ---- Form / controls ---- */
  .form-section { margin-top: 24px; }

  .radio-group {
    display: flex;
    gap: 16px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .radio-group label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
  }

  textarea {
    width: 100%;
    min-height: 120px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font);
    font-size: 0.9rem;
    padding: 10px 12px;
    resize: vertical;
    margin-bottom: 12px;
    transition: border-color .15s;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  .btn-row { display: flex; gap: 10px; }

  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 8px 20px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { opacity: .5; cursor: default; }

  /* ---- State overlays ---- */
  .state-overlay {
    text-align: center;
    padding: 40px 20px;
  }
  .state-overlay .icon { font-size: 2.5rem; display: block; margin-bottom: 10px; }
  .state-overlay p { color: var(--muted); font-size: 0.92rem; margin-top: 6px; }

  .spinner {
    display: inline-block;
    width: 22px; height: 22px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .approved-msg .icon { color: var(--success); }
  .error-msg { color: var(--danger); font-size: 0.88rem; margin-top: 8px; }

  /* doc-panel needs relative+overflow-visible so annotation triggers can peek left */
  #doc-panel {
    overflow: visible;
    padding-left: 40px;
  }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <h1>Drovr Review Loop</h1>
      <span class="turn-badge" id="turn-badge"></span>
    </div>
    <button id="theme-btn" onclick="toggleTheme()">Toggle theme</button>
  </div>

  <div id="summary-banner" style="display:none" class="summary-banner">
    <strong>Agent change summary</strong>
    <span id="summary-text"></span>
  </div>

  <!-- Code-review surface: merged findings + the reviewed base..HEAD diff.
       Only shown when the page is opened with ?task=<task>. -->
  <div id="review-panel" style="display:none" class="panel">
    <div class="panel-title">Code review &middot; <span id="review-task"></span></div>
    <div id="review-verdict" class="review-verdict"></div>
    <div id="review-findings" class="review-findings"></div>
    <div class="panel-title" style="margin-top:18px">Reviewed diff (base&hellip;HEAD)</div>
    <div id="review-diff" class="diff-content"></div>
  </div>

  <div id="diff-panel" style="display:none" class="panel">
    <div class="panel-title with-action">
      <span>Changes this turn</span>
      <button id="diff-toggle-btn" class="panel-action-btn" onclick="toggleDiff()">Hide diff</button>
    </div>
    <div id="diff-content" class="diff-content md-content"></div>
  </div>

  <div id="doc-panel" class="panel">
    <div class="panel-title">Current spec</div>
    <div id="doc-content" class="md-content"></div>
  </div>

  <div id="waiting-overlay" style="display:none" class="panel">
    <div class="state-overlay">
      <div class="spinner"></div>
      <strong>Waiting for agent revision&hellip;</strong>
      <p>Polling for state change. The page will reload when ready.</p>
    </div>
  </div>

  <div id="approved-overlay" style="display:none" class="panel">
    <div class="state-overlay approved-msg">
      <span class="icon">&#10003;</span>
      <strong>Approved!</strong>
      <p>The spec has been approved. The review loop is complete.</p>
    </div>
  </div>

  <div id="form-section" class="panel form-section">
    <div class="panel-title">Your decision</div>
    <div class="radio-group">
      <label>
        <input type="radio" name="decision" value="request-changes" checked> Request changes
      </label>
      <label>
        <input type="radio" name="decision" value="approve"> Approve
      </label>
    </div>

    <!-- Open questions (multiple choice) — populated dynamically -->
    <div id="questions-area"></div>

    <textarea id="feedback" placeholder="Feedback for the agent (required for request-changes)…"></textarea>
    <div class="btn-row">
      <button class="primary" id="submit-btn" onclick="submitDecision()">Submit</button>
    </div>
    <div id="form-error" class="error-msg" style="display:none"></div>
  </div>
</div>

<script>
// ---- Theme ----
(function() {
  var saved = localStorage.getItem('rl-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
})();

function toggleTheme() {
  var current = document.documentElement.getAttribute('data-theme');
  var next;
  if (!current) {
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    next = prefersDark ? 'light' : 'dark';
  } else {
    next = current === 'dark' ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('rl-theme', next);
}

// ---- Diff visibility ----
// The "Changes this turn" source diff can be collapsed by the reviewer; the
// preference persists across refreshes/reloads via localStorage. The panel
// wrapper (and its toggle button) stay visible so the diff can be reopened.
function diffHidden() { return localStorage.getItem('rl-diff-hidden') === '1'; }

function applyDiffVisibility() {
  var hidden = diffHidden();
  document.getElementById('diff-content').style.display = hidden ? 'none' : '';
  var btn = document.getElementById('diff-toggle-btn');
  if (btn) btn.textContent = hidden ? 'Show diff' : 'Hide diff';
}

function toggleDiff() {
  localStorage.setItem('rl-diff-hidden', diffHidden() ? '0' : '1');
  applyDiffVisibility();
}

// ---- markdown-it with source-line injection ----
// Override the renderer so block-level elements get data-source-line="N"
// Token.map = [startLine, endLine], both 0-indexed; we emit startLine+1 (1-based).
var md = (function() {
  if (!window.markdownit) return null;
  var instance = window.markdownit();

  // Patch renderToken to inject data-source-line on opening block tokens that have .map
  var origRenderToken = instance.renderer.renderToken.bind(instance.renderer);
  instance.renderer.renderToken = function(tokens, idx, options) {
    var token = tokens[idx];
    // Only inject on opening tags (not self-closing inline) that carry source map info
    if (token.map && token.map.length >= 2 && token.nesting === 1) {
      // Inject attribute before rendering
      token.attrSet('data-source-line', String(token.map[0] + 1));
    }
    return origRenderToken(tokens, idx, options);
  };

  return instance;
})();

function renderMd(text) {
  if (!md) return '<pre>' + escHtml(text) + '</pre>';
  return md.render(text);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---- Source diff (before → after) ----
// A simple LCS-based diff over an array of tokens, returning an ordered list of
// ops: {type: 'eq'|'del'|'add', a, b} where a/b are the token values.
function lcsDiff(a, b) {
  var n = a.length, m = b.length;
  // DP table of LCS lengths. Bounded by document size (fine for specs).
  var dp = [];
  for (var i = 0; i <= n; i++) dp.push(new Array(m + 1).fill(0));
  for (var i = n - 1; i >= 0; i--) {
    for (var j = m - 1; j >= 0; j--) {
      dp[i][j] = (a[i] === b[j])
        ? dp[i + 1][j + 1] + 1
        : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  var ops = [];
  var i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { ops.push({ type: 'eq', a: a[i], b: b[j] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ type: 'del', a: a[i] }); i++; }
    else { ops.push({ type: 'add', b: b[j] }); j++; }
  }
  while (i < n) { ops.push({ type: 'del', a: a[i] }); i++; }
  while (j < m) { ops.push({ type: 'add', b: b[j] }); j++; }
  return ops;
}

// Split a line into diff tokens for word-level highlighting: words and the
// whitespace between them, preserved so re-joined output equals the input.
function wordTokens(line) {
  return line.match(/\s+|\S+/g) || [];
}

// Word-level diff of a removed/added line pair → { del: html, add: html }.
function refineLinePair(oldLine, newLine) {
  var ops = lcsDiff(wordTokens(oldLine), wordTokens(newLine));
  var delHtml = '', addHtml = '';
  ops.forEach(function(op) {
    if (op.type === 'eq') { delHtml += escHtml(op.a); addHtml += escHtml(op.b); }
    else if (op.type === 'del') { delHtml += '<del>' + escHtml(op.a) + '</del>'; }
    else { addHtml += '<ins>' + escHtml(op.b) + '</ins>'; }
  });
  return { del: delHtml, add: addHtml };
}

// Render a readable unified before→after diff of two markdown SOURCE strings.
// Unchanged lines are neutral; removed lines red, added lines green, with
// word-level emphasis on lines that were changed (a del immediately followed
// by an add).
function renderSourceDiff(oldText, newText) {
  var oldLines = oldText.replace(/\n$/, '').split('\n');
  var newLines = newText.replace(/\n$/, '').split('\n');
  var ops = lcsDiff(oldLines, newLines);

  var rows = [];
  function pushLine(cls, gutter, html) {
    rows.push('<div class="diff-line ' + cls + '">'
      + '<span class="gutter">' + gutter + '</span>'
      + '<span class="text">' + html + '</span></div>');
  }

  for (var k = 0; k < ops.length; ) {
    var op = ops[k];
    if (op.type === 'eq') {
      pushLine('ctx', ' ', escHtml(op.a));
      k++;
      continue;
    }
    // Gather the run of consecutive removals, then consecutive additions.
    var delRun = [], addRun = [];
    while (k < ops.length && ops[k].type === 'del') { delRun.push(ops[k].a); k++; }
    while (k < ops.length && ops[k].type === 'add') { addRun.push(ops[k].b); k++; }
    if (delRun.length === 1 && addRun.length === 1) {
      // A modified line: word-level refine the single del/add pair.
      var refined = refineLinePair(delRun[0], addRun[0]);
      pushLine('del', '−', refined.del);
      pushLine('add', '+', refined.add);
    } else {
      // Distinct block of removals and/or additions: whole-line highlight.
      delRun.forEach(function(l) { pushLine('del', '−', escHtml(l)); });
      addRun.forEach(function(l) { pushLine('add', '+', escHtml(l)); });
    }
  }
  return '<div class="diff-lines">' + rows.join('') + '</div>';
}

// ---- Code-review surface (findings + reviewed diff) ----
// Task label from the page URL (?task=<task>); absent → panel stays hidden.
function reviewTask() {
  try { return new URLSearchParams(window.location.search).get('task') || ''; }
  catch (e) { return ''; }
}

// Map findings to a "file:line" lookup so they can be layered inline over the
// reviewed diff. Findings without a line are shown in the list only.
function findingsByLoc(findings) {
  var map = {};
  (findings || []).forEach(function(f) {
    if (f.file && f.line != null) {
      var key = f.file + ':' + f.line;
      (map[key] = map[key] || []).push(f);
    }
  });
  return map;
}

// Render one merged Review's findings as a list (severity badge, angle tag,
// file:line, summary, rationale). Empty/clean → a neutral note.
function renderFindings(findings) {
  if (!findings || !findings.length) {
    return '<div class="review-empty">No findings.</div>';
  }
  return findings.map(function(f) {
    var sev = (f.severity || 'nit').toLowerCase();
    var loc = escHtml(f.file || '') + (f.line != null ? ':' + escHtml(String(f.line)) : '');
    var html = '<div class="finding">'
      + '<div class="finding-head">'
      + '<span class="sev-badge ' + escHtml(sev) + '">' + escHtml(sev) + '</span>'
      + (f.angle ? '<span class="angle-tag">' + escHtml(f.angle) + '</span>' : '')
      + '<span class="finding-loc">' + loc + '</span>'
      + '</div>'
      + '<div class="finding-summary">' + escHtml(f.summary || '') + '</div>'
      + (f.rationale ? '<div class="finding-rationale">' + escHtml(f.rationale) + '</div>' : '')
      + '</div>';
    return html;
  }).join('');
}

// Render a unified `git diff` (base..HEAD) as an AI-annotated, syntax-highlighted
// diff via @pierre/diffs (client-side SSR). Falls back to the legacy line renderer
// if the pierre bundle failed to load or errors. Async: preloadPatchDiff returns a
// promise; callers await it.
async function renderReviewDiff(diffText, locMap) {
  var P = window.PierreDiffs;
  if (P && P.preloadPatchDiff && diffText) {
    try {
      var res = await P.preloadPatchDiff({ patch: diffText });
      if (res && res.prerenderedHTML) {
        return '<div class="pierre-diff">' + res.prerenderedHTML + '</div>';
      }
    } catch (e) {
      if (window.console) console.error('pierre render failed, using legacy renderer:', e);
    }
  }
  return legacyRenderReviewDiff(diffText, locMap);
}

// Legacy hand-rolled unified-diff renderer (fallback). Reuses the green/red
// diff-line styling and layers inline finding markers keyed by new-side file:line.
function legacyRenderReviewDiff(diffText, locMap) {
  var lines = diffText.replace(/\n$/, '').split('\n');
  var rows = [];
  var curFile = '';
  var newNo = 0;
  function marks(file, line) {
    var hits = locMap[file + ':' + line];
    if (!hits) return '';
    return hits.map(function(f) {
      var sev = (f.severity || 'nit').toLowerCase();
      return '<span class="finding-mark ' + escHtml(sev) + '" title="'
        + escHtml(f.summary || '') + '">' + escHtml(sev) + '</span>';
    }).join('');
  }
  function row(cls, gutter, text, extra) {
    rows.push('<div class="diff-line ' + cls + '">'
      + '<span class="gutter">' + gutter + '</span>'
      + '<span class="text">' + escHtml(text) + (extra || '') + '</span></div>');
  }
  lines.forEach(function(line) {
    if (line.indexOf('diff --git') === 0 || line.indexOf('index ') === 0) {
      row('meta', ' ', line); return;
    }
    if (line.indexOf('--- ') === 0) { row('meta', ' ', line); return; }
    if (line.indexOf('+++ ') === 0) {
      curFile = line.slice(4).replace(/^b\//, '');
      row('meta', ' ', line); return;
    }
    if (line.indexOf('@@') === 0) {
      var m = line.match(/\+(\d+)/);
      // Keep the running counter on a malformed header rather than resetting to
      // 0, which would misplace every subsequent inline finding marker.
      newNo = m ? parseInt(m[1], 10) : newNo;
      row('hunk', ' ', line); return;
    }
    var c = line.charAt(0);
    if (c === '+') { row('add', '+', line.slice(1), marks(curFile, newNo)); newNo++; }
    else if (c === '-') { row('del', '−', line.slice(1)); }
    else { row('ctx', ' ', line.slice(1), marks(curFile, newNo)); newNo++; }
  });
  return '<div class="diff-lines">' + rows.join('') + '</div>';
}

// Fetch merged findings + the reviewed diff and populate the review panel.
// Additive and defensive: absent endpoints render an empty panel; any error
// leaves the panel hidden so the spec-review loop is unaffected.
async function refreshReview() {
  var task = reviewTask();
  if (!task) { hideEl('review-panel'); return; }
  var q = '?task=' + encodeURIComponent(task);

  var review = {};
  try {
    var fr = await fetch('/review/findings' + q);
    if (fr.ok) review = await fr.json();
  } catch (e) { review = {}; }
  var findings = (review && review.findings) || [];

  document.getElementById('review-task').textContent = task;

  var verdictEl = document.getElementById('review-verdict');
  var verdict = review && review.verdict ? review.verdict : '';
  verdictEl.className = 'review-verdict ' + (verdict === 'clean' ? 'clean' : (verdict === 'changes' ? 'changes' : ''));
  verdictEl.textContent = verdict ? ('verdict: ' + verdict) : '';

  document.getElementById('review-findings').innerHTML = renderFindings(findings);

  var diffText = await fetchText('/review/diff' + q);
  var diffEl = document.getElementById('review-diff');
  if (diffText && diffText.trim().length > 0) {
    diffEl.innerHTML = await renderReviewDiff(diffText, findingsByLoc(findings));
  } else {
    diffEl.innerHTML = '<div class="review-empty">No reviewed diff yet.</div>';
  }

  showEl('review-panel');
}

// ---- Per-line annotations ----
// annotations: Map<lineNum(1-based), {quote, comments:[{id, text}]}>
var annotations = {};
var _annotIdSeq = 0;
var currentTurn = 0;

// Persist annotations across page refreshes (incl. the loop's own reload after
// each turn). Keyed by turn: a manual refresh mid-turn restores in-progress
// comments; a new turn starts clean (the prior turn's were already submitted).
var ANNOT_KEY = 'rl-annotations';
function saveAnnotations() {
  try {
    localStorage.setItem(ANNOT_KEY, JSON.stringify({
      turn: currentTurn, seq: _annotIdSeq, annotations: annotations
    }));
  } catch (e) {}
}
function loadAnnotations(turn) {
  try {
    var raw = localStorage.getItem(ANNOT_KEY);
    if (!raw) return;
    var stored = JSON.parse(raw);
    if (stored && stored.turn === turn && stored.annotations) {
      annotations = stored.annotations;
      _annotIdSeq = stored.seq || _annotIdSeq;
    } else if (stored && stored.turn !== turn) {
      localStorage.removeItem(ANNOT_KEY); // stale (new turn) — clear
      annotations = {};
    }
  } catch (e) {}
}

// After rendering doc content, wire up annotation triggers on each block with data-source-line
function wireAnnotations(container, sourceLines) {
  // sourceLines: array of strings (0-indexed), the raw markdown source split by \n
  // Only annotate leaf-most blocks: skip any element that contains another
  // [data-source-line] descendant (a <ul>/<ol> wrapping <li>s, or an <li>
  // wrapping a <p>). Otherwise lists get nested, overlapping "+" triggers.
  var all = Array.prototype.slice.call(container.querySelectorAll('[data-source-line]'));
  var seenLine = {};
  var blocks = all.filter(function(b) {
    if (b.querySelector('[data-source-line]')) return false; // not a leaf
    var l = b.getAttribute('data-source-line');
    if (seenLine[l]) return false;                           // dedupe by source line
    seenLine[l] = 1;
    return true;
  });
  blocks.forEach(function(block) {
    var lineNum = parseInt(block.getAttribute('data-source-line'), 10);
    var quote = (lineNum >= 1 && lineNum <= sourceLines.length)
      ? sourceLines[lineNum - 1]
      : '';

    // Make the block position:relative so the trigger can be absolute
    block.classList.add('annotatable');

    // Create trigger button
    var trigger = document.createElement('button');
    trigger.className = 'annot-trigger';
    trigger.setAttribute('type', 'button');
    trigger.setAttribute('title', 'Add annotation to line ' + lineNum);
    trigger.textContent = '+';
    block.appendChild(trigger);

    // Saved annotations display for this line
    var savedEl = document.createElement('div');
    savedEl.className = 'saved-annotations';
    savedEl.id = 'saved-annots-' + lineNum;
    block.appendChild(savedEl);

    // Render any existing saved annotations (carried over from previous render)
    renderSavedAnnotations(lineNum, savedEl, quote);

    trigger.addEventListener('click', function(e) {
      e.stopPropagation();
      openAnnotationBox(block, lineNum, quote, savedEl);
    });
  });
}

function renderSavedAnnotations(lineNum, container, quote) {
  container.innerHTML = '';
  var entry = annotations[lineNum];
  if (!entry || !entry.comments.length) return;
  entry.comments.forEach(function(c) {
    var chip = document.createElement('div');
    chip.className = 'saved-annot-chip';
    var commentEl = document.createElement('span');
    commentEl.className = 'annot-comment';
    commentEl.textContent = c.text;
    var removeBtn = document.createElement('button');
    removeBtn.className = 'annot-remove';
    removeBtn.setAttribute('type', 'button');
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', function() {
      removeAnnotation(lineNum, c.id);
      renderSavedAnnotations(lineNum, container, quote);
    });
    chip.appendChild(commentEl);
    chip.appendChild(removeBtn);
    container.appendChild(chip);
  });
}

function openAnnotationBox(block, lineNum, quote, savedEl) {
  // If a box is already open on this block, remove it
  var existing = block.querySelector('.annotation-box');
  if (existing) { existing.remove(); return; }

  var box = document.createElement('div');
  box.className = 'annotation-box';

  var ta = document.createElement('textarea');
  ta.placeholder = 'Annotation for line ' + lineNum + '…';
  ta.className = '';
  ta.style.minHeight = '60px';

  var btnRow = document.createElement('div');
  btnRow.className = 'btn-row';

  var saveBtn = document.createElement('button');
  saveBtn.setAttribute('type', 'button');
  saveBtn.className = 'primary annotation-save-btn';
  saveBtn.textContent = 'Save';
  saveBtn.addEventListener('click', function() {
    var text = ta.value.trim();
    if (!text) return;
    _annotIdSeq++;
    if (!annotations[lineNum]) annotations[lineNum] = { quote: quote, comments: [] };
    annotations[lineNum].quote = quote;
    annotations[lineNum].comments.push({ id: _annotIdSeq, text: text });
    saveAnnotations();
    renderSavedAnnotations(lineNum, savedEl, quote);
    box.remove();
  });

  var cancelBtn = document.createElement('button');
  cancelBtn.setAttribute('type', 'button');
  cancelBtn.className = 'annotation-cancel-btn';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.addEventListener('click', function() { box.remove(); });

  box.appendChild(ta);
  btnRow.appendChild(saveBtn);
  btnRow.appendChild(cancelBtn);
  box.appendChild(btnRow);
  block.insertBefore(box, savedEl);
  ta.focus();
}

function removeAnnotation(lineNum, id) {
  var entry = annotations[lineNum];
  if (!entry) return;
  entry.comments = entry.comments.filter(function(c) { return c.id !== id; });
  if (!entry.comments.length) delete annotations[lineNum];
  saveAnnotations();
}

function collectAnnotations() {
  var result = [];
  Object.keys(annotations).forEach(function(lineStr) {
    var lineNum = parseInt(lineStr, 10);
    var entry = annotations[lineNum];
    entry.comments.forEach(function(c) {
      result.push({ line: lineNum, quote: entry.quote, comment: c.text });
    });
  });
  return result;
}

// ---- Open questions (multiple choice) ----
var currentQuestions = [];

function renderQuestions(questions) {
  currentQuestions = questions || [];
  var area = document.getElementById('questions-area');
  if (!currentQuestions.length) { area.innerHTML = ''; return; }

  var html = '<div class="questions-panel"><div class="panel-title">Open questions</div>';
  currentQuestions.forEach(function(q, qi) {
    html += '<div class="question-item">';
    html += '<div class="question-prompt">' + escHtml(q.prompt) + '</div>';
    html += '<div class="question-options">';
    (q.options || []).forEach(function(opt, oi) {
      var inputId = 'q_' + qi + '_' + oi;
      var checked = opt.recommended ? ' checked' : '';
      html += '<label for="' + inputId + '">';
      html += '<input type="radio" id="' + inputId + '" name="q_' + escHtml(q.id) + '" value="' + escHtml(opt.value) + '"' + checked + '>';
      html += escHtml(opt.label);
      if (opt.recommended) html += ' <span class="rec-badge">recommended</span>';
      html += '</label>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  area.innerHTML = html;
}

function collectAnswers() {
  var answers = {};
  currentQuestions.forEach(function(q) {
    var checked = document.querySelector('input[name="q_' + q.id + '"]:checked');
    if (checked) answers[q.id] = checked.value;
  });
  return answers;
}

// ---- State ----
var pollTimer = null;
var currentDocText = '';

function showEl(id) { document.getElementById(id).style.display = ''; }
function hideEl(id) { document.getElementById(id).style.display = 'none'; }

async function fetchText(url) {
  var r = await fetch(url);
  if (r.status === 204) return '';
  if (!r.ok) return '';
  return r.text();
}

async function refresh() {
  clearTimeout(pollTimer);

  var [stateRes, docText, priorText, summaryText, questionsData] = await Promise.all([
    fetch('/state').then(function(r){ return r.json(); }),
    fetchText('/doc'),
    fetchText('/prior'),
    fetchText('/summary'),
    fetch('/questions').then(function(r){ return r.json(); }).catch(function(){ return []; })
  ]);

  currentDocText = docText;
  var state = stateRes.state;
  var turn = stateRes.turn;
  currentTurn = turn;
  loadAnnotations(turn);

  // turn badge
  document.getElementById('turn-badge').textContent = 'turn ' + turn + ' · ' + state;

  // summary banner
  if (summaryText && turn > 0) {
    document.getElementById('summary-text').textContent = summaryText;
    showEl('summary-banner');
  } else {
    hideEl('summary-banner');
  }

  // doc panel — render with source-line attributes then wire annotations
  if (docText) {
    var docContentEl = document.getElementById('doc-content');
    docContentEl.innerHTML = renderMd(docText);
    var sourceLines = docText.split('\n');
    wireAnnotations(docContentEl, sourceLines);
  }

  // diff panel — before→after diff of the raw markdown SOURCE (not rendered
  // HTML): unchanged lines neutral, removals red, additions green.
  if (priorText && priorText.trim().length > 0) {
    document.getElementById('diff-content').innerHTML =
      renderSourceDiff(priorText, docText);
    showEl('diff-panel');
    applyDiffVisibility();
  } else {
    hideEl('diff-panel');
  }

  // code-review surface (findings + reviewed diff) — independent of the spec
  // loop state; only renders when the page was opened with ?task=<task>.
  refreshReview().catch(function(){});

  // questions
  renderQuestions(questionsData);

  // Show correct overlay / form
  if (state === 'approved') {
    hideEl('form-section');
    hideEl('waiting-overlay');
    showEl('approved-overlay');
    return;
  }

  if (state === 'waiting') {
    hideEl('form-section');
    hideEl('approved-overlay');
    showEl('waiting-overlay');
    pollTimer = setTimeout(pollState, 1000);
    return;
  }

  // idle or ready: show form
  hideEl('waiting-overlay');
  hideEl('approved-overlay');
  document.getElementById('submit-btn').disabled = false;
  showEl('form-section');
}

async function pollState() {
  try {
    var r = await fetch('/state');
    var data = await r.json();
    if (data.state === 'ready' || data.state === 'approved') {
      await refresh();
    } else {
      pollTimer = setTimeout(pollState, 1000);
    }
  } catch(e) {
    pollTimer = setTimeout(pollState, 2000);
  }
}

async function submitDecision() {
  var btn = document.getElementById('submit-btn');
  var errEl = document.getElementById('form-error');
  errEl.style.display = 'none';

  var decision = document.querySelector('input[name="decision"]:checked');
  if (!decision) { showError('Select a decision.'); return; }
  var decisionVal = decision.value;
  var feedbackVal = document.getElementById('feedback').value.trim();

  if (decisionVal === 'request-changes' && !feedbackVal) {
    showError('Feedback is required when requesting changes.');
    return;
  }

  btn.disabled = true;

  var payload = {
    decision: decisionVal,
    feedback: feedbackVal,
    answers: collectAnswers(),
    annotations: collectAnnotations()
  };

  try {
    var r = await fetch('/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    var data = await r.json();
    if (!data.ok) { showError('Submit failed.'); btn.disabled = false; return; }
    // State flipped; refresh to reflect
    await refresh();
  } catch(e) {
    showError('Network error: ' + e.message);
    btn.disabled = false;
  }
}

function showError(msg) {
  var el = document.getElementById('form-error');
  el.textContent = msg;
  el.style.display = '';
}

// ---- Init ----
refresh().catch(console.error);
</script>
